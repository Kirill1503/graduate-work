version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: my-postgres
    environment:
      POSTGRES_DB: ADS
      POSTGRES_USER: Anton
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ads-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ADS
      SPRING_DATASOURCE_USERNAME: Anton
      SPRING_DATASOURCE_PASSWORD: "12345"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
